name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Get bundled Java 8 runtime from the matching upstream release
        run: |
          set -euo pipefail
          apk_url="https://github.com/2009scape/2009Scape-mobile/releases/download/hd-2.4/2009Scape-HD-2.4-debug.apk"
          curl --fail --location --retry 3 "$apk_url" --output /tmp/2009Scape-HD-2.4-debug.apk
          mkdir -p /tmp/2009scape-runtime app_pojavlauncher/src/main/assets/components/jre
          unzip -q /tmp/2009Scape-HD-2.4-debug.apk 'assets/components/jre/*' -d /tmp/2009scape-runtime
          cp -R /tmp/2009scape-runtime/assets/components/jre/. app_pojavlauncher/src/main/assets/components/jre/
          test -s app_pojavlauncher/src/main/assets/components/jre/universal.tar.xz
          test -s app_pojavlauncher/src/main/assets/components/jre/version

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.6.1

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Google Play .aab
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_pojavlauncher:bundleGplay
          mv app_pojavlauncher/build/outputs/bundle/gplay/app_pojavlauncher-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Generate APK SHA-256 checksum
        run: |
          sha256sum out/app-debug.apk > out/app-debug.sha256
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
          changesNotSentForReview: true

